name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Two quick pushes must not pull and restart on the server at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # bridge.php ships inside dist/ and is the only server-side PHP; a syntax
      # error there would break Explain and the admin agent for everyone.
      - name: Check bridge.php syntax
        run: php -l public/bridge.php

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ESV_API_TOKEN: ${{ secrets.VITE_ESV_API_TOKEN }}
          VITE_NLT_API_KEY: ${{ secrets.VITE_NLT_API_KEY }}
          VITE_ZACKION_CHAT_URL: ${{ secrets.VITE_ZACKION_CHAT_URL }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust the server's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      # The bridge runs from the server's own checkout, not from dist/. Pull it
      # first so the new bridge.php below never talks to an older bridge.
      - name: Update server repo and bridge
        run: |
          ssh -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            'cd /var/www/selah-app && before=$(git rev-parse HEAD) && git pull --ff-only -q && sh deploy/update-server.sh "$before"'

      - name: Sync build to Hostinger
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }}" \
            --exclude '.well-known' \
            dist/ "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/"
