name: Agent job

# Runs one queued agent_jobs row — an admin's question, or the discipleship
# consolidation report — and writes the answer back to Supabase.
#
# WHY HERE AND NOT ON THE WEB HOST
#
# The agent used to run continuously on Hostinger behind public/bridge.php.
# That could not hold: the shared plan's process limiter killed OpenCode
# whenever it did real work, silently. The whole stack now starts inside this
# runner, is used, and is thrown away with it — the same shape the nightly
# devotion uses. Nothing persistent runs anywhere, and no port is exposed.
#
# The app never talks to this workflow. It queues a row via the trigger-agent
# Edge Function and watches that row; this job is what fills it in.
#
# Required repository secrets (shared with Daily devotion):
#   OPENCODE_AUTH_JSON          contents of ~/.local/share/opencode/auth.json
#                               from a machine where `opencode auth login` has
#                               been run. Holds a live API key.
#   SUPABASE_SERVICE_ROLE_KEY   Supabase > Project Settings > API > service_role.
#                               RLS denies every client write to agent_jobs, so
#                               this is what lets the runner record the result.
#   VITE_SUPABASE_URL           already set for the deploy workflow; reused here.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'agent_jobs row to run (uuid)'
        required: true
        type: string

permissions:
  contents: read

# Deliberately NOT grouped with `daily-content`: an admin asking a question at
# 03:00 should not cancel or queue behind the nightly devotion, and two
# different admins asking at once is normal. The runner claims its row with a
# conditional update, so concurrent runs cannot collide over one job.
concurrency:
  group: agent-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A consolidation waits up to 9 minutes for the agent; the rest is setup.
    # This is a backstop against a wedged runner, not a target.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend/bridge/opencode-bridge

      # ~150 MB binary. Shares the Daily devotion cache key, so whichever runs
      # first warms it for the other.
      - name: Cache OpenCode
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.opencode
          key: opencode-${{ runner.os }}-v1

      - name: Install OpenCode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Put OpenCode on PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # Credentials are found via $HOME. Without this the agent starts fine and
      # every model returns an EMPTY reply rather than an auth error, which is
      # the single most confusing failure in this stack.
      - name: Restore OpenCode credentials
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          if [ -z "$OPENCODE_AUTH_JSON" ]; then
            echo "::error::OPENCODE_AUTH_JSON secret is not set. Copy ~/.local/share/opencode/auth.json from a logged-in machine."
            exit 1
          fi
          mkdir -p ~/.local/share/opencode
          printf '%s' "$OPENCODE_AUTH_JSON" > ~/.local/share/opencode/auth.json
          chmod 600 ~/.local/share/opencode/auth.json
          opencode auth list

      - name: Start OpenCode and the bridge
        run: |
          set -eu
          opencode serve --port 4097 --hostname 127.0.0.1 > /tmp/opencode.log 2>&1 &
          ( cd backend/bridge/opencode-bridge && \
            OPENCODE_ROOT_PATH="$GITHUB_WORKSPACE" BRIDGE_HOST=127.0.0.1 \
            node server.js > /tmp/bridge.log 2>&1 & )

          # Wait for the bridge's COMPOSITE health: it reports OpenCode's state
          # too, and a healthy bridge in front of a dead OpenCode is exactly the
          # state that produces silent empty replies.
          for i in $(seq 1 60); do
            if curl -fsS -m 5 http://127.0.0.1:4098/api/health 2>/dev/null | grep -q '"success":true'; then
              echo "bridge and opencode are ready after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::bridge/opencode did not become healthy in 60s"
          echo "--- opencode.log ---"; cat /tmp/opencode.log || true
          echo "--- bridge.log ---";   cat /tmp/bridge.log   || true
          exit 1

      - name: Run the job
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRIDGE_URL: http://127.0.0.1:4098
          JOB_ID: ${{ inputs.job_id }}
        run: node scripts/run-agent-job.js

      # The prompt actually sent and the reply actually received. Keeps a bad
      # run diagnosable without paying for another one.
      - name: Upload the prompt and reply
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-job-${{ github.run_id }}
          path: |
            .selah-debug/
            /tmp/opencode.log
            /tmp/bridge.log
          if-no-files-found: ignore
          retention-days: 14
