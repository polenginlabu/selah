<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#f7faf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)" />
    <!-- iOS only supports Web Push for a site added to the Home Screen and
         opened from there (iOS 16.4+) — these make that a real standalone
         app instead of just a bookmarked Safari tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Selah" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/SELAH_dark.png" />
    <title>Selah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && prefersDark)) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        background: #f7faf6;
      }

      html.dark,
      html.dark body {
        background: #101613;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f7faf6;
      }

      .dark #boot-splash {
        background: #101613;
      }

      #boot-splash img {
        width: 9rem;
        height: auto;
      }

      #boot-splash .dark-logo {
        display: none;
      }

      .dark #boot-splash .light-logo {
        display: none;
      }

      .dark #boot-splash .dark-logo {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-label="Loading Selah">
      <img class="light-logo" src="/SELAH_dark.png" alt="Selah" />
      <img class="dark-logo" src="/SELAH_light.png" alt="Selah" />
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
