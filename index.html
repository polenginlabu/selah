<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F5FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
    <!-- iOS only supports Web Push for a site added to the Home Screen and
         opened from there (iOS 16.4+) — these make that a real standalone
         app instead of just a bookmarked Safari tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Selah" />
    <link rel="manifest" href="/manifest.json" />
    <!-- ?v= busts the browser favicon cache, which otherwise pins the old icon
         indefinitely — it ignores normal cache headers. Bump on icon changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>Selah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && prefersDark)) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        background: #F2F5FF;
      }

      html.dark,
      html.dark body {
        background: #111418;
      }

      /* Mirrors SplashScreen in src/App.jsx — same padding, centring and
         <Logo size={40} /> geometry — so the React splash underneath lines up
         exactly when this one fades. Change both together. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background: #F2F5FF;
        transition: opacity 200ms ease-out;
      }

      #boot-splash.is-done {
        opacity: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
      }

      .dark #boot-splash {
        background: #111418;
      }

      #boot-splash .lockup {
        display: flex;
        align-items: center;
      }

      #boot-splash svg {
        margin-right: -3px;
      }

      #boot-splash .wordmark {
        font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
        font-weight: 800;
        font-size: 26px;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #0D1B36;
      }

      .dark #boot-splash .wordmark {
        color: oklch(0.96 0.008 262);
      }

      #boot-splash .wordmark span {
        color: #4F6EF7;
      }

      .dark #boot-splash .wordmark span {
        color: #7B93F9;
      }

      #boot-splash .bar-fg {
        fill: #0D1B36;
      }

      .dark #boot-splash .bar-fg {
        fill: oklch(0.96 0.008 262);
      }

      #boot-splash .bar-accent {
        fill: #4F6EF7;
      }

      .dark #boot-splash .bar-accent {
        fill: #7B93F9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-label="Loading">
      <div class="lockup" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect class="bar-fg" x="13.8" y="11.2" width="4.4" height="17.6" rx="2.2" />
          <rect class="bar-accent" x="21.8" y="11.2" width="4.4" height="17.6" rx="2.2" />
        </svg>
        <div class="wordmark">selah<span>.</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
